<html lang="en">

  <head>
    <title>Ceeblue Videojs Player</title>
    <meta charset="utf-8">
    <meta content="Ceeblue" name="author">
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <link href="assets/ceeblue-logo-32x32.png" rel="icon" sizes="32x32">
    <link href="assets/ceeblue-logo-192x192.png" rel="icon" sizes="192x192">

    <link crossorigin="anonymous" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" rel="stylesheet">
    <link crossorigin="anonymous" href="https://use.fontawesome.com/releases/v5.1.0/css/solid.css"
      integrity="sha384-TbilV5Lbhlwdyc4RuIV/JhD8NR+BfMrvz4BL5QFa2we1hQu6wvREr3v6XSRfCTRp" rel="stylesheet">
    <link crossorigin="anonymous" href="https://use.fontawesome.com/releases/v5.1.0/css/fontawesome.css"
      integrity="sha384-ozJwkrqb90Oa3ZNb+yKFW2lToAWYdTiF1vt8JiH5ptTGHTGcN7qdoR1F95e0kYyG" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/video.js@8.22.0/dist/video-js.min.css" rel="stylesheet">
    <link href="../dist/videojs-plugins.css" rel="stylesheet">

    <style>
    body {
      margin-top: 1em;
      margin-bottom: 3em;
    }

    .panel-tab__content {
      min-height: 12rem;
    }

    .nav-tabs .nav-link {
      color: #495057;
    }

    .nav-tabs .nav-link:not(.active) {
      color: #495057;
      background-color: transparent;
      border-color: transparent;
    }

    .nav-tabs .nav-link:not(.active):hover,
    .nav-tabs .nav-link:not(.active):focus {
      color: #212529;
      border-color: transparent;
    }

    .tab-badge {
      margin-left: 0.35rem;
    }

    .messages-panel {
      min-height: 12rem;
      max-height: 18rem;
      white-space: pre;
      font-family: monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      overflow-y: auto;
    }

    [v-cloak] {
      display: none;
    }

    .drm-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
      font-size: 0.82rem;
      line-height: 1.2;
      white-space: nowrap;
    }

    .drm-status__label {
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: rgba(248, 250, 252, 0.7);
    }

    .drm-status__value {
      font-weight: 600;
    }

    .player-actions {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-top: 0.5rem;
    }

    .player-actions__center {
      grid-column: 2;
      justify-self: center;
    }

    .player-actions__right {
      grid-column: 3;
      justify-self: start;
      margin-left: 1rem;
    }

    @media (max-width: 767.98px) {
      .player-actions {
        grid-template-columns: 1fr;
        row-gap: 0.75rem;
      }

      .player-actions__center,
      .player-actions__right {
        grid-column: 1;
        justify-self: center;
        margin-left: 0;
      }
    }
    </style>
  </head>

  <body class="container">
    <div class="row">
      <div class="row col-12">
        <div class="col-12 col-md-6">
          <a href="https://ceeblue.net"><img alt="CEEBLUE Media Services" class="rounded mx-auto d-block" src="assets/ceeblue-logo.png"/></a>
        </div>
        <div class="col-12 col-md-6 d-flex align-items-center justify-content-center">
          <a href="https://videojs.com" id="videojs-logo"><img src="assets/videojs-logo-black.svg"></img></a>
        </div>
      </div>

      <div class="col-md-12 mt-4" id="main">
        <div class="col-12">
          <ul class="nav nav-pills nav-fill">
            <li v-for="value in sources" class="nav-item">
              <a class="nav-link" href="#" :class="{ active: value == source}" v-on:click.stop.prevent="changeSource">{{ value }}</a>
            </li>
          </ul>
        </div>

        <div class="card text-center border-0">
          <div class="card-body">
            <video ref="videoPlayer" class="video-js vjs-default-skin vjs-fluid" playsinline controls autoplay></video>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-6 col-sm-3" v-if="shouldShowSignalingSelector()">
            <select class="custom-select" id="signaling-selection"
              :disabled="playState !== PlayState.STOPPED"
              v-model="connectorType" title="Signaling">
              <option v-bind:value="option" v-for="option in connectorTypes">
                {{ option }}
              </option>
            </select>
          </div>
          <div class="form-group col-6" :class="shouldShowSignalingSelector() ? 'col-sm-5' : 'col-sm-6'">
            <input :disabled="isPlaying()" class="form-control"
              placeholder="Node host" type="text"
              v-model="host" title="Ceeblue node host">
          </div>
          <div class="form-group col-6" :class="shouldShowSignalingSelector() ? 'col-sm-4' : 'col-sm-6'">
            <input disabled class="form-control"
              placeholder="Video quality" type="text"
              v-model="quality" title="Stream quality">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-6">
            <input :disabled="isPlaying()" class="form-control"
              placeholder="Stream name" type="text"
              v-model="streamName" title="Stream name">
          </div>

          <div class="form-group col-6">
            <input :disabled="isPlaying()" class="form-control"
              placeholder="Access token cc0f52bb-92bb-462b-8218-88c3febe8533" type="text"
              v-model="accessToken" title="Private stream token">
          </div>
        </div>

        <div class="form-row" v-if="isWrtsSelected()">
          <div class="form-group col-12 col-md-4">
            <div class="form-check mt-2">
              <input class="form-check-input" id="wrts-frame-skipping" type="checkbox"
                v-model="wrtsAdaptiveFrameSkipping"
                v-on:change="applyWrtsRuntimeSettings">
              <label class="form-check-label" for="wrts-frame-skipping">
                Adaptive Frame-Skipping
              </label>
            </div>
          </div>

          <div class="form-group col-12 col-md-4">
            <select class="custom-select"
              v-model="wrtsNetworkProfile"
              v-on:change="applyWrtsNetworkProfile"
              title="WRTS network profile">
              <option v-bind:value="option.value" v-for="option in wrtsNetworkProfiles">
                {{ option.label }}
              </option>
            </select>
          </div>

          <div class="form-group col-6 col-md-2">
            <input class="form-control"
              placeholder="Buffer min"
              type="number"
              min="0"
              step="100"
              v-model="wrtsBufferLimitLow"
              v-on:change="applyWrtsRuntimeSettings"
              title="WRTS low buffer threshold (ms)">
          </div>

          <div class="form-group col-6 col-md-2">
            <input class="form-control"
              placeholder="Buffer max"
              type="number"
              min="0"
              step="100"
              v-model="wrtsBufferLimitHigh"
              v-on:change="applyWrtsRuntimeSettings"
              title="WRTS high buffer threshold (ms)">
          </div>
        </div>

        <div class="player-actions" v-cloak>
          <div class="player-actions__center">
            <button class="btn" type="button"
              v-bind:class="{ 'btn-danger': isPlaying(), 'btn-success': isStopped(), 'btn-secondary': isStarting() }"
              v-on:click="play">
              <span>{{ playButtonCaption() }} <i class="fas fa-spinner fa-pulse"
                  v-if="isStarting()"></i></span>
            </button>
          </div>
          <div class="player-actions__right" v-if="shouldShowDRMStatus()">
            <div class="drm-status" title="Supported content decryption modules for the current encrypted stream">
              <span class="drm-status__label">DRM</span>
              <span class="drm-status__value">{{ drmStatusLabel() }}</span>
            </div>
          </div>
        </div>

        <div class="card border-0 mt-4">
          <div class="card-body px-0">
            <ul class="nav nav-tabs">
              <li class="nav-item">
                <a class="nav-link" href="#"
                  :class="{ active: bottomPanelTab === 'graph' }"
                  v-on:click.stop.prevent="bottomPanelTab = 'graph'">
                  Graph
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#"
                  :class="{ active: bottomPanelTab === 'messages' }"
                  v-on:click.stop.prevent="bottomPanelTab = 'messages'">
                  Messages
                  <span class="badge badge-primary tab-badge" v-if="pendingMessageCount > 0">{{ pendingMessageCount }}</span>
                </a>
              </li>
            </ul>

            <div class="border border-top-0 rounded-bottom bg-white p-3 panel-tab__content">
              <div v-show="bottomPanelTab === 'graph'">
                <div class="text-muted" v-if="!hasMetrics">
                  Real-time metrics will appear here once playback starts.
                </div>
                <ul class="list-group list-group-flush" ref="stats" v-show="hasMetrics"></ul>
                <div class="form-row mt-3" v-show="hasMetrics">
                  <div class="form-group mx-auto mb-0">
                    <img class="m-1" alt="Reset metric references" title="Reset metric references and rescale the chart" type="button" @click="resetMetrics()" src="./assets/reload.png" style="object-fit:contain" height="32">
                    <img class="m-1" alt="Download metrics report" title="Download metrics as a CSV report" type="button" @click="downloadStats()" src="./assets/download.png" style="object-fit:contain" height="32">
                  </div>
                </div>
              </div>

              <div v-show="bottomPanelTab === 'messages'">
                <div class="messages-panel overflow-auto">
                  {{ dataMessages || 'No messages yet.' }}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
    // development version, includes helpful console warnings
    // import { createApp } from 'https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.js';
    // production version, optimized for size and speed
    import {
      Util,
      NetAddress,
      UIMetrics,
    } from 'https://cdn.jsdelivr.net/npm/@ceeblue/web-utils@7.8.0/dist/web-utils.min.js';
    import { createApp } from 'https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.prod.js';
    import 'https://cdn.jsdelivr.net/npm/webrtc-adapter/out/adapter.js';
    import 'https://cdn.jsdelivr.net/npm/video.js@8.22.0/dist/video.min.js';
    import 'https://cdn.jsdelivr.net/npm/videojs-contrib-eme@5.5.2/dist/videojs-contrib-eme.js';
    import '../dist/videojs-plugins.js';

    const Ceeblue = videojs.getPlugin('ceeblue');

    const PlayState = {
      PLAYING: 'PLAYING',
      STARTING: 'STARTING',
      STOPPED: 'STOPPED'
    };
    // /!\ keep this outside of the app to avoid issues with vuejs proxying)
    let player = null; // the videojs Player
    let textTracksBound = false;
    let metricsTimer = null;

    createApp({
      data() {
        return {
          PlayState: PlayState,
          playState: PlayState.STOPPED,

          streamName: '',
          accessToken: null,
          host: null,

          audio: null,
          video: null,
          videobutton: true,
          retryCount: 0,
          auto: true,

          connectorTypes: ['WebSocket (WS)', 'HTTP (WHEP)'],
          connectorType: 'WebSocket (WS)',
          sources: Ceeblue.protocols,
          source: '',
          selectedSource: '',
          playerOptions: {},
          bottomPanelTab: 'graph',
          wrtsAdaptiveFrameSkipping: true,
          wrtsNetworkProfiles: [
            { value: '-manual-', label: 'Network profile: -manual-' },
            { value: 'ideal', label: 'Network profile: ideal', bufferLimitLow: 200, bufferLimitHigh: 500 },
            { value: 'normal', label: 'Network profile: normal', bufferLimitLow: 400, bufferLimitHigh: 800 },
            { value: 'distant', label: 'Network profile: distant', bufferLimitLow: 1000, bufferLimitHigh: 2000 },
            { value: 'unstable', label: 'Network profile: unstable', bufferLimitLow: 2000, bufferLimitHigh: 4000 },
          ],
          wrtsNetworkProfile: 'normal',
          wrtsBufferLimitLow: '400',
          wrtsBufferLimitHigh: '800',

          dataMessages: '',
          pendingMessageCount: 0,
          hasMetrics: false,
          stats: new Map(),
          uiStats: null,
          times: [],
          deltaStats: {
            stallCount: 0,
            skippedAudio: 0,
            skippedVideo: 0,
            lostPacketCount: 0,
            nackCount: 0
          },
          quality: '',
          supportedCDMs: null,
          currentSourceEncrypted: false,
          currentSourceKeySystems: null,
          activeCDM: '',
          boundTechElement: null,
        }
      },
      created() {
        const options = Util.options();
        // init values
        const host = options.host;
        this.host = new NetAddress(host || location.host, 443);
        this.streamName = options.stream;
        this.accessToken = options.accesstoken || options.token;

        this.audioTrack = options.audio;
        this.videoTrack = options.video;
        this.videobutton = options.videobutton != false;
        this.retryCount = options.retryCount;
        this.auto = options.auto !== false;
        this.selectedSource = options.protocol || '';
        this.connectorType = host && host.toLowerCase().startsWith('http')? this.connectorTypes[1] : this.connectorTypes[0];
        this.wrtsAdaptiveFrameSkipping = options.adaptiveFrameSkipping !== false;
        this.wrtsNetworkProfile = options.wrtsProfile || 'normal';
        this.wrtsBufferLimitLow = options.bufferLimitLow || '400';
        this.wrtsBufferLimitHigh = options.bufferLimitHigh || '800';

        this.applyWrtsNetworkProfile();
      },
      mounted() {
        this.stats = new Map();
        const bandwidths = []; this.stats.set('Bandwidth', bandwidths);
        const bufferAmounts = []; this.stats.set('Buffer', bufferAmounts);
        const latencies = []; this.stats.set('Latency', latencies);
        const playbackRates = []; this.stats.set('Playback rate', playbackRates);
        const playbackSpeeds = []; this.stats.set('Playback speed', playbackSpeeds);
        const fps = []; this.stats.set('Video FPS', fps);
        const trackAudio = []; this.stats.set('Track audio', trackAudio);
        const trackVideo = []; this.stats.set('Track video', trackVideo);
        const skippedAudio = []; this.stats.set('Skipped audio', skippedAudio);
        const skippedVideo = []; this.stats.set('Skipped video', skippedVideo);
        const stalls = []; this.stats.set('Stalls', stalls);
        const packetLoss = []; this.stats.set('Packet loss', packetLoss);
        const nack = []; this.stats.set('Nack', nack);
        const rtt = []; this.stats.set('RTT', rtt);
        const jitter = []; this.stats.set('Jitter', jitter);
        this.uiStats = new UIMetrics(this.$refs.stats);

        setInterval(() => {
          const wrtsSource = this.getCurrentWrtsSource();
          const wrtsPlayer = wrtsSource?.wrtsPlayer;

          if (wrtsPlayer?.running) {
            const stats = wrtsPlayer.computeStats();
            // For bandwidth calculation, using player.recvByteRate is faster than
            // summing stats.audioByteRate + stats.videoByteRate + stats.dataByteRate.
            if(bandwidths.length || wrtsPlayer.recvByteRate) {
              bandwidths.push(Math.round(wrtsPlayer.recvByteRate*8/1000)+"kbps");
            }
            if(bufferAmounts.length || stats.bufferAmount) {
              bufferAmounts.push(stats.bufferAmount+"ms");
            }
            if(latencies.length || stats.latency) {
              latencies.push(stats.latency+"ms");
            }

            playbackRates.push((stats.playbackRate || 0).toFixed(2));
            playbackSpeeds.push((stats.playbackSpeed || 0).toFixed(2));
            fps.push((stats.videoPerSecond || 0).toFixed(2));
            trackAudio.push(((stats.audioTrackBandwidth || 0)*8/1000).toFixed() + 'kbps');
            trackVideo.push(((stats.videoTrackBandwidth || 0)*8/1000).toFixed() + 'kbps');

            skippedAudio.push((((stats.skippedAudio || 0) - (this.deltaStats.skippedAudio || 0)) /1000).toFixed(1)+"s");
            skippedVideo.push((((stats.skippedVideo || 0) - (this.deltaStats.skippedVideo || 0)) /1000).toFixed(1)+"s");

            stalls.push((stats.stallCount || 0) - (this.deltaStats.stallCount || 0));
          } else {
            // when WRTS is not running, try WebRTC
            const webrtcSource = this.getCurrentWebRTCSource();
            const webrtcPlayer = webrtcSource?.webRTCPlayer;

            if (!webrtcPlayer) {
              return;
            }

            const stats = webrtcPlayer.computeStats();
            const byteRate = (stats.audioByteRate || 0) + (stats.videoByteRate || 0) + (stats.dataByteRate || 0);

            bandwidths.push(Math.round(byteRate * 8) + 'kbps');
            bufferAmounts.push(Math.round(stats.bufferAmount || 0) + 'ms');
            playbackSpeeds.push((stats.playbackSpeed || 0).toFixed(2));
            fps.push((stats.videoPerSecond || 0).toFixed(2));
            trackAudio.push((((stats.audioTrackBandwidth || 0) * 8) / 1000).toFixed(0) + 'kbps');
            trackVideo.push((((stats.videoTrackBandwidth || 0) * 8) / 1000).toFixed(0) + 'kbps');
            skippedAudio.push(((((stats.skippedAudio || 0) - this.deltaStats.skippedAudio) / 1000).toFixed(1)) + 's');
            skippedVideo.push(((((stats.skippedVideo || 0) - this.deltaStats.skippedVideo) / 1000).toFixed(1)) + 's');
            stalls.push(String((stats.stallCount || 0) - this.deltaStats.stallCount));
            packetLoss.push(String((stats.lostPacketCount || 0) - this.deltaStats.lostPacketCount));
            nack.push(String((stats.nackCount || 0) - this.deltaStats.nackCount));
            rtt.push((((stats.rtt || 0) * 1000).toFixed(0)) + 'ms');
            jitter.push((((stats.jitter || 0) * 1000).toFixed(0)) + 'ms');
          }

          // Finally update the graph
          this.times.push({
            time: new Date().toISOString(),
            mediaTime: player?.currentTime?.() || 0
          });
          this.hasMetrics = true;
          this.uiStats.display(this.stats);
        }, 700);
      },
      methods: {
        resetMetrics(all=false) {
          this.uiStats?.reset();
          this.deltaStats = {
            stallCount: 0,
            skippedAudio: 0,
            skippedVideo: 0,
            lostPacketCount: 0,
            nackCount: 0
          };
          const displayableCount = all ? 0 : this.uiStats.displayableCount;
          for(let [_, values] of this.stats) {
              values.splice(0, Math.max(0, values.length - displayableCount));
          }
          this.times.splice(0, Math.max(0, this.times.length - displayableCount));
        },
        download(name, data, type) {
          const url = URL.createObjectURL(new Blob([data], { type }));
          const link = document.createElement('a');

          link.setAttribute('href', url);
          link.setAttribute('download', name);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        },
        downloadStats() {
          let csv = '';
          let max = this.times.length;
          const headers = ['localTime', 'mediaTime'];

          for (const [header, values] of this.stats) {
            headers.push(header);
            max = Math.max(max, values.length);
          }

          csv = headers.join(';');

          for (let i = 0; i < max; ++i) {
            csv += '\n';
            const { time, mediaTime } = this.times[i] ?? {};

            csv += (time || '') + ';' + (mediaTime || '') + ';';
            for (const [, values] of this.stats) {
              csv += (values[i] == null ? '' : parseFloat(values[i])) + ';';
            }
          }

          this.download('stats.csv', csv, 'text/csv;charset=utf-8;');
        },
        appendMessage(message) {
          const currentLines = this.dataMessages ? this.dataMessages.split(/\r\n|\r|\n/) : [];
          const nextLines = [...currentLines, message].filter(Boolean).slice(-20);

          this.dataMessages = nextLines.join('\n');

          if (this.bottomPanelTab !== 'messages') {
            this.pendingMessageCount += 1;
          }
        },
        buildProtocols(selectedSource) {
          if (!selectedSource) {
            return [...this.sources];
          }

          const orderedProtocols = this.sources.filter((source) => source !== selectedSource);

          return [selectedSource, ...orderedProtocols];
        },
        buildQueryParams() {
          const query = new URLSearchParams();

          if (this.audioTrack) {
            query.set('audio', this.audioTrack);
          }
          if (this.videoTrack) {
            query.set('video', this.videoTrack);
          }

          return query;
        },
        buildWrtsSettings() {
          const settings = {
            reliable: !this.wrtsAdaptiveFrameSkipping
          };
          const bufferLimitLow = Number.parseInt(this.wrtsBufferLimitLow, 10);
          const bufferLimitHigh = Number.parseInt(this.wrtsBufferLimitHigh, 10);

          if (!Number.isNaN(bufferLimitLow)) {
            settings.bufferLimitLow = bufferLimitLow;
          }

          if (!Number.isNaN(bufferLimitHigh)) {
            settings.bufferLimitHigh = bufferLimitHigh;
          }

          return settings;
        },
        buildPlayerOptions(selectedSource) {
          const signaling = this.connectorType === this.connectorTypes[1] ? 'whip' : 'ceeblue-ws';

          return {
            responsive: true,
            muted: true,
            html5: {
              nativeControlsForTouch: false,
              vhs: {overrideNative: true},
              nativeAudioTracks: false,
              nativeVideoTracks: false,
            },
            plugins: {
              ceeblue: {
                autoFallback: this.auto,
                endPoint: this.host.toString(),
                streamName: this.streamName,
                accessToken: this.accessToken || void 0,
                maxRetries: Number.parseInt(this.retryCount, 10) || 1,
                enableQualityOptions: !!this.videobutton,
                protocols: this.buildProtocols(selectedSource),
                query: this.buildQueryParams(),
                keySystems: {
                  'com.widevine.alpha': 'https://widevine-dash.ezdrm.com/widevine-php/widevine-foreignkey.php?pX=B752A3',
                  'com.microsoft.playready': 'https://playready.ezdrm.com/cency/preauth.aspx?pX=CAF350',
                  'com.apple.fps': {
                    certificateUri: 'https://na-fps.ezdrm.com/demo/video/eleisure.cer',
                    licenseUri: 'https://fps.ezdrm.com/api/licenses/auth?pX=48EA94&assetid=c9e170a5-b3af-49d8-a8ad-fc2d90104744'
                  }
                },
                settings: {
                  webrtc: {
                    signaling,
                  },
                  wrts: this.buildWrtsSettings(),
                }
              }
            }
          };
        },
        getCurrentWrtsSource() {
          if (!player) {
            return null;
          }

          const tech = player.tech_ || (typeof player.tech === 'function' ? player.tech(true) : null);

          return tech?.wrts || null;
        },
        getCurrentWebRTCSource() {
          if (!player) {
            return null;
          }

          const tech = player.tech_ || (typeof player.tech === 'function' ? player.tech(true) : null);

          return tech?.webrtc || null;
        },
        getCurrentProtocol() {
          const plugin = player?.ceeblue?.();

          return plugin?.currentSource?.sourceType || '';
        },
        getSupportedCDMNames() {
          const supportedCDMs = this.supportedCDMs;

          if (!supportedCDMs) {
            return [];
          }

          const labels = {
            fairplay: 'FairPlay',
            playready: 'PlayReady',
            widevine: 'Widevine'
          };

          return Object.entries(labels)
            .filter(([key]) => !!supportedCDMs[key])
            .map(([, label]) => label);
        },
        shouldShowDRMStatus() {
          return this.currentSourceEncrypted;
        },
        shouldShowSignalingSelector() {
          return this.sources.includes('webrtc');
        },
        drmStatusLabel() {
          if (this.activeCDM) {
            return this.activeCDM;
          }

          const supportedNames = this.getSupportedCDMNames();

          if (!supportedNames.length) {
            return 'Encrypted stream';
          }

          return 'Available: ' + supportedNames.join(' · ');
        },
        getConfiguredDRMSystems(source) {
          if (!source?.keySystems) {
            return [];
          }

          const labels = {
            'com.apple.fps': 'FairPlay',
            'com.apple.fps.1_0': 'FairPlay',
            'com.microsoft.playready': 'PlayReady',
            'com.widevine.alpha': 'Widevine'
          };

          return Object.keys(source.keySystems)
            .map(key => labels[key])
            .filter(Boolean);
        },
        getCDMLabelFromEvent(event) {
          const labels = {
            'com.apple.fps': 'FairPlay',
            'com.apple.fps.1_0': 'FairPlay',
            'com.microsoft.playready': 'PlayReady',
            'com.widevine.alpha': 'Widevine'
          };
          const keySystem =
            event?.keySystem ||
            event?.keySystemAccess?.keySystem ||
            event?.mediaKeySystemAccess?.keySystem ||
            event?.target?.keySystem;

          return labels[keySystem] || '';
        },
        bindTechEvents() {
          const tech = player?.tech?.(true) || player?.tech_ || null;
          const techElement = tech?.el?.() || tech?.el_ || null;

          if (!techElement || this.boundTechElement === techElement) {
            return;
          }

          this.boundTechElement = techElement;

          if (tech?.on) {
            tech.on('licenserequestattempted', (event) => {
              const cdm = this.getCDMLabelFromEvent(event);

              if (cdm) {
                this.activeCDM = cdm;
              }
            });

            tech.on('keystatuschange', (event) => {
              const cdm = this.getCDMLabelFromEvent(event);

              if (cdm) {
                this.activeCDM = cdm;
              }
            });
          }

          if (techElement?.addEventListener) {
            techElement.addEventListener('encrypted', () => {
              this.currentSourceEncrypted = true;

              if (!this.activeCDM) {
                const configuredSystems = this.getConfiguredDRMSystems({ keySystems: this.currentSourceKeySystems });

                if (configuredSystems.length === 1) {
                  [this.activeCDM] = configuredSystems;
                }
              }
            });
          }
        },
        isWrtsSelected() {
          return (this.source || this.selectedSource) === 'wrts';
        },
        syncPlaybackState(nextState) {
          this.playState = nextState;
          this.source = nextState === PlayState.STOPPED ? '' : this.getCurrentProtocol();

          if (nextState === PlayState.STOPPED) {
            this.quality = '';
            this.currentSourceEncrypted = false;
            this.currentSourceKeySystems = null;
            this.activeCDM = '';
            this.boundTechElement = null;
          }
        },
        updateQualityFromLevels() {
          if (!player || typeof player.qualityLevels !== 'function') {
            this.quality = '';
            return;
          }

          const qualityLevels = player.qualityLevels();

          if (!qualityLevels || qualityLevels.selectedIndex < 0) {
            this.quality = '';
            return;
          }

          const quality = qualityLevels[qualityLevels.selectedIndex];

          if (!quality) {
            this.quality = '';
            return;
          }

          this.quality = quality.width + 'x' + quality.height + ' ' + Math.floor(quality.bitrate / 1000) + 'kbps';
        },
        bindPlayerEvents() {
          this.bindTechEvents();

          player.on('sourcechanged', (event) => {
            const source = event.details.source;

            console.log('sourcechanged', source);
            console.log('source keySystems', source?.keySystems);

            if (typeof player.eme === 'object' && !this.supportedCDMs) {
              player.eme.detectSupportedCDMs()
              .then(supportedCDMs => {
                // Sample output: {fairplay: false, playready: false, widevine: true, clearkey: true}
                console.log('supportedCDMs :', supportedCDMs);
                this.supportedCDMs = supportedCDMs;
              });
            }

            this.currentSourceEncrypted = false;
            this.currentSourceKeySystems = source?.keySystems || null;
            this.activeCDM = '';
            this.boundTechElement = null;
            setTimeout(() => this.bindTechEvents(), 0);
            if (source) {
              this.dataMessages = '';
              this.pendingMessageCount = 0;
              this.resetMetrics(true);
            } else {
              this.syncPlaybackState(PlayState.STOPPED);
            }
            this.source = source?.sourceType || this.getCurrentProtocol();
            this.selectedSource = this.source || this.selectedSource;
            this.updateQualityFromLevels();
          });

          player.on('loadstart', () => {
            this.syncPlaybackState(PlayState.STARTING);
            setTimeout(() => this.bindTechEvents(), 0);
          });

          player.on('loadedmetadata', () => {
            this.syncPlaybackState(PlayState.PLAYING);
            this.updateQualityFromLevels();
          });

          if (typeof player.qualityLevels === 'function') {
            const qualityLevels = player.qualityLevels();

            qualityLevels?.on('change', () => {
              this.updateQualityFromLevels();
            });
          }

          if (!textTracksBound) {
            player.textTracks().on('addtrack', (e) => {
              const track = e.track;

              track.on('cuechange', () => {
                const cue = track.activeCues[0];
                if (!cue) {
                  return;
                }
                const label = track.label ? '[' + track.label + ']' : '[' + cue.startTime.toFixed(3) + ']';

                this.appendMessage(label + ' ' + cue.text);
              });
            });
            textTracksBound = true;
          }
        },
        startPlayback(selectedSource) {
          console.log('StartPlayback', { selectedSource, currentSource: this.source, previouslySelectedSource: this.selectedSource });
          const nextSource = selectedSource || this.selectedSource || void 0;

          if (nextSource) {
            this.selectedSource = nextSource;
          }

          this.syncPlaybackState(PlayState.STARTING);

          this.playerOptions = this.buildPlayerOptions(nextSource);
          const ceeblueOptions = this.playerOptions.plugins.ceeblue;

          if (player) {
            player.ceeblue().replaceOptions(ceeblueOptions);
          } else {
            player = videojs(this.$refs.videoPlayer, this.playerOptions);
            this.bindPlayerEvents();
          }
        },
        applyWrtsNetworkProfile() {
          const profile = this.wrtsNetworkProfiles.find((entry) => entry.value === this.wrtsNetworkProfile);

          if (!profile || profile.value === '-manual-') {
            this.applyWrtsRuntimeSettings();
            return;
          }

          this.wrtsBufferLimitLow = profile.bufferLimitLow.toFixed();
          this.wrtsBufferLimitHigh = profile.bufferLimitHigh.toFixed();
          this.applyWrtsRuntimeSettings();
        },
        applyWrtsRuntimeSettings() {
          const wrtsSource = this.getCurrentWrtsSource();

          if (!wrtsSource) {
            return;
          }

          const bufferLimitLow = Number.parseInt(this.wrtsBufferLimitLow, 10);
          const bufferLimitHigh = Number.parseInt(this.wrtsBufferLimitHigh, 10);

          if (!Number.isNaN(bufferLimitLow)) {
            wrtsSource.bufferLimitLow = bufferLimitLow;
          }

          if (!Number.isNaN(bufferLimitHigh)) {
            wrtsSource.bufferLimitHigh = bufferLimitHigh;
          }

          wrtsSource.reliable = !this.wrtsAdaptiveFrameSkipping;
        },
        stopPlayback() {
          console.log('StopPlayback');
          if (!player) {
            return;
          }

          player.ceeblue().stop();
        },
        changeSource(e) {
          this.selectedSource = e.target.text;
          if (this.source == e.target.text)
            return;
          if (!player) {
            this.startPlayback(e.target.text);
          } else {
            player.ceeblue().setSource({ protocol: e.target.text });
          }
        },
        play() {
          if(this.playState === PlayState.STOPPED) {
            this.startPlayback();
          } else {
            this.stopPlayback();
          }
        },

        playButtonCaption() {
          if (this.isStopped())
            return 'Play';
          if (this.isStarting())
            return 'Starting... ';
          if (this.isPlaying())
            return 'Stop';
        },
        isPlaying() {
          return this.playState === PlayState.PLAYING;
        },
        isStarting() {
          return this.playState === PlayState.STARTING;
        },
        isStopped() {
          return this.playState === PlayState.STOPPED;
        }
      },
      watch: {
        bottomPanelTab(nextTab) {
          if (nextTab === 'messages') {
            this.pendingMessageCount = 0;
          }
        }
      }
    }).mount('#main');
    </script>
  </body>
</html>
