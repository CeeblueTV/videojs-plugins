<html lang="en">

  <head>
    <title>Ceeblue Videojs Player</title>
    <meta charset="utf-8">
    <meta content="Ceeblue" name="author">
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <link href="assets/ceeblue-logo-32x32.png" rel="icon" sizes="32x32">
    <link href="assets/ceeblue-logo-192x192.png" rel="icon" sizes="192x192">

    <link crossorigin="anonymous" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" rel="stylesheet">
    <link crossorigin="anonymous" href="https://use.fontawesome.com/releases/v5.1.0/css/solid.css"
      integrity="sha384-TbilV5Lbhlwdyc4RuIV/JhD8NR+BfMrvz4BL5QFa2we1hQu6wvREr3v6XSRfCTRp" rel="stylesheet">
    <link crossorigin="anonymous" href="https://use.fontawesome.com/releases/v5.1.0/css/fontawesome.css"
      integrity="sha384-ozJwkrqb90Oa3ZNb+yKFW2lToAWYdTiF1vt8JiH5ptTGHTGcN7qdoR1F95e0kYyG" rel="stylesheet">
    <link href="https://vjs.zencdn.net/8.20.0/video-js.css" rel="stylesheet">
    <link href="../dist/videojs-plugins.css" rel="stylesheet">

    <style>
    body {
      margin-top: 1em;
      margin-bottom: 3em;
    }

    .panel-tab__content {
      min-height: 12rem;
    }

    .nav-tabs .nav-link {
      color: #495057;
    }

    .nav-tabs .nav-link:not(.active) {
      color: #495057;
      background-color: transparent;
      border-color: transparent;
    }

    .nav-tabs .nav-link:not(.active):hover,
    .nav-tabs .nav-link:not(.active):focus {
      color: #212529;
      border-color: transparent;
    }

    .tab-badge {
      margin-left: 0.35rem;
    }

    .messages-panel {
      min-height: 12rem;
      max-height: 18rem;
      white-space: pre;
      font-family: monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      overflow-y: auto;
    }

    [v-cloak] {
      display: none;
    }
    </style>
  </head>

  <body class="container">
    <div class="row">
      <div class="row col-12">
        <div class="col-12 col-md-6">
          <a href="https://ceeblue.net"><img alt="CEEBLUE Media Services" class="rounded mx-auto d-block" src="assets/ceeblue-logo.png"/></a>
        </div>
        <div class="col-12 col-md-6 d-flex align-items-center justify-content-center">
          <a href="https://videojs.com" id="videojs-logo"><img src="assets/videojs-logo-black.svg"></img></a>
        </div>
      </div>

      <div class="col-md-12 mt-4" id="main">
        <div class="col-12">
          <ul class="nav nav-pills nav-fill">
            <li v-for="value in sources" class="nav-item">
              <a class="nav-link" href="#" :class="{ active: value == source}" v-on:click.stop.prevent="changeSource">{{ value }}</a>
            </li>
          </ul>
        </div>

        <div class="card text-center border-0">
          <div class="card-body">
            <video ref="videoPlayer" class="video-js vjs-default-skin vjs-fluid" playsinline controls autoplay></video>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-6 col-sm-4">
            <select class="custom-select" id="signaling-selection"
              :disabled="playState !== PlayState.STOPPED"
              v-model="connectorType" title="Signaling">
              <option v-bind:value="option" v-for="option in connectorTypes">
                {{ option }}
              </option>
            </select>
          </div>
          <div class="form-group col-6 col-sm-4">
            <input :disabled="isPlaying()" class="form-control"
              placeholder="Node host" type="text"
              v-model="host" title="Ceeblue node host">
          </div>
          <div class="form-group col-6 col-sm-4">
            <input disabled class="form-control"
              placeholder="Video quality" type="text"
              v-model="quality" title="Stream quality">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-6">
            <input :disabled="isPlaying()" class="form-control"
              placeholder="Stream name" type="text"
              v-model="streamName" title="Stream name">
          </div>

          <div class="form-group col-6">
            <input :disabled="isPlaying()" class="form-control"
              placeholder="Access token cc0f52bb-92bb-462b-8218-88c3febe8533" type="text"
              v-model="accessToken" title="Private stream token">
          </div>
        </div>

        <div class="form-row" v-if="isWrtsSelected()">
          <div class="form-group col-12 col-md-4">
            <div class="form-check mt-2">
              <input class="form-check-input" id="wrts-frame-skipping" type="checkbox"
                v-model="wrtsAdaptiveFrameSkipping"
                v-on:change="applyWrtsRuntimeSettings">
              <label class="form-check-label" for="wrts-frame-skipping">
                Adaptive Frame-Skipping
              </label>
            </div>
          </div>

          <div class="form-group col-12 col-md-4">
            <select class="custom-select"
              v-model="wrtsNetworkProfile"
              v-on:change="applyWrtsNetworkProfile"
              title="WRTS network profile">
              <option v-bind:value="option.value" v-for="option in wrtsNetworkProfiles">
                {{ option.label }}
              </option>
            </select>
          </div>

          <div class="form-group col-6 col-md-2">
            <input class="form-control"
              placeholder="Buffer min"
              type="number"
              min="0"
              step="100"
              v-model="wrtsBufferLimitLow"
              v-on:change="applyWrtsRuntimeSettings"
              title="WRTS low buffer threshold (ms)">
          </div>

          <div class="form-group col-6 col-md-2">
            <input class="form-control"
              placeholder="Buffer max"
              type="number"
              min="0"
              step="100"
              v-model="wrtsBufferLimitHigh"
              v-on:change="applyWrtsRuntimeSettings"
              title="WRTS high buffer threshold (ms)">
          </div>
        </div>

        <div class="d-flex justify-content-center" v-cloak>
          <button class="btn" type="button"
            v-bind:class="{ 'btn-danger': isPlaying(), 'btn-success': isStopped(), 'btn-secondary': isStarting() }"
            v-on:click="play">
            <span>{{ playButtonCaption() }} <i class="fas fa-spinner fa-pulse"
                v-if="isStarting()"></i></span>
          </button>
        </div>

        <div class="card border-0 mt-4">
          <div class="card-body px-0">
            <ul class="nav nav-tabs">
              <li class="nav-item">
                <a class="nav-link" href="#"
                  :class="{ active: bottomPanelTab === 'graph' }"
                  v-on:click.stop.prevent="bottomPanelTab = 'graph'">
                  Graph
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#"
                  :class="{ active: bottomPanelTab === 'messages' }"
                  v-on:click.stop.prevent="bottomPanelTab = 'messages'">
                  Messages
                  <span class="badge badge-primary tab-badge" v-if="pendingMessageCount > 0">{{ pendingMessageCount }}</span>
                </a>
              </li>
            </ul>

            <div class="border border-top-0 rounded-bottom bg-white p-3 panel-tab__content">
              <div v-show="bottomPanelTab === 'graph'">
                <div class="text-muted" v-if="!hasMetrics">
                  WRTS metrics will appear here once playback starts.
                </div>
                <ul class="list-group list-group-flush" ref="stats" v-show="hasMetrics"></ul>
              </div>

              <div v-show="bottomPanelTab === 'messages'">
                <div class="messages-panel overflow-auto">
                  {{ dataMessages || 'No messages yet.' }}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
    // development version, includes helpful console warnings
    // import { createApp } from 'https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.js';
    // production version, optimized for size and speed
    import {
      Util,
      NetAddress,
      UIMetrics,
    } from 'https://cdn.jsdelivr.net/npm/@ceeblue/web-utils@7.8.0/dist/web-utils.min.js';
    import { createApp } from 'https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.prod.js';
    import 'https://cdn.jsdelivr.net/npm/webrtc-adapter/out/adapter.js';
    import 'https://vjs.zencdn.net/8.20.0/video.min.js';
    import '../dist/videojs-plugins.js';

    const Ceeblue = videojs.getPlugin('ceeblue');

    const PlayState = {
      PLAYING: 'PLAYING',
      STARTING: 'STARTING',
      STOPPED: 'STOPPED'
    };
    // /!\ keep this outside of the app to avoid issues with vuejs proxying)
    let player = null; // the videojs Player
    let textTracksBound = false;
    let metricsTimer = null;

    createApp({
      data() {
        return {
          PlayState: PlayState,
          playState: PlayState.STOPPED,

          streamName: '',
          accessToken: null,
          host: null,

          audio: null,
          video: null,
          videobutton: true,
          retryCount: 0,
          auto: true,

          connectorTypes: ['WebSocket (WS)', 'HTTP (WHEP)'],
          connectorType: 'WebSocket (WS)',
          sources: Ceeblue.protocols,
          source: '',
          selectedSource: '',
          playerOptions: {},
          bottomPanelTab: 'graph',
          wrtsAdaptiveFrameSkipping: true,
          wrtsNetworkProfiles: [
            { value: '-manual-', label: 'Network profile: -manual-' },
            { value: 'ideal', label: 'Network profile: ideal', bufferLimitLow: 200, bufferLimitHigh: 500 },
            { value: 'normal', label: 'Network profile: normal', bufferLimitLow: 400, bufferLimitHigh: 800 },
            { value: 'distant', label: 'Network profile: distant', bufferLimitLow: 1000, bufferLimitHigh: 2000 },
            { value: 'unstable', label: 'Network profile: unstable', bufferLimitLow: 2000, bufferLimitHigh: 4000 },
          ],
          wrtsNetworkProfile: 'normal',
          wrtsBufferLimitLow: '400',
          wrtsBufferLimitHigh: '800',

          dataMessages: '',
          pendingMessageCount: 0,
          hasMetrics: false,
          stats: new Map(),
          uiStats: null,
          quality: '',
        }
      },
      created() {
        const options = Util.options();
        // init values
        const host = options.host;
        this.host = new NetAddress(host || location.host, 443);
        this.streamName = options.stream;
        this.accessToken = options.accesstoken || options.token;

        this.audioTrack = options.audio;
        this.videoTrack = options.video;
        this.videobutton = options.videobutton != false;
        this.retryCount = options.retryCount;
        this.auto = options.auto !== false;
        this.selectedSource = options.protocol || '';
        this.connectorType = host && host.toLowerCase().startsWith('http')? this.connectorTypes[1] : this.connectorTypes[0];
        this.wrtsAdaptiveFrameSkipping = options.adaptiveFrameSkipping !== false;
        this.wrtsNetworkProfile = options.wrtsProfile || 'normal';
        this.wrtsBufferLimitLow = options.bufferLimitLow || '400';
        this.wrtsBufferLimitHigh = options.bufferLimitHigh || '800';

        this.applyWrtsNetworkProfile();
      },
      mounted() {
        this.initializeStats();
      },
      methods: {
        initializeStats() {
          this.stats = new Map();
          this.stats.set('Bandwidth', []);
          this.stats.set('Buffer', []);
          this.stats.set('Latency', []);
          this.stats.set('Playback rate', []);
          this.stats.set('Playback speed', []);
          this.stats.set('Video FPS', []);
          this.stats.set('Track audio', []);
          this.stats.set('Track video', []);
          this.stats.set('Skipped audio', []);
          this.stats.set('Skipped video', []);
          this.stats.set('Stalls', []);
          this.uiStats = new UIMetrics(this.$refs.stats);
          this.startMetricsPolling();
        },
        startMetricsPolling() {
          if (metricsTimer) {
            clearInterval(metricsTimer);
          }

          metricsTimer = setInterval(() => {
            this.updateMetrics();
          }, 700);
        },
        updateMetrics() {
          if (!this.uiStats) {
            return;
          }

          const wrtsSource = this.getCurrentWrtsSource();
          const wrtsPlayer = wrtsSource?.wrtsPlayer;

          if (!wrtsPlayer?.running) {
            return;
          }

          const stats = wrtsPlayer.computeStats();

          this.hasMetrics = true;
          this.pushStatValue('Bandwidth', Math.round((wrtsPlayer.recvByteRate || 0) * 8 / 1000) + 'kbps');
          this.pushStatValue('Buffer', Math.round(stats.bufferAmount || 0) + 'ms');
          this.pushStatValue('Latency', Math.round(stats.latency || 0) + 'ms');
          this.pushStatValue('Playback rate', (stats.playbackRate || 0).toFixed(2));
          this.pushStatValue('Playback speed', (stats.playbackSpeed || 0).toFixed(2));
          this.pushStatValue('Video FPS', (stats.videoPerSecond || 0).toFixed(2));
          this.pushStatValue('Track audio', Math.round(((stats.audioTrackBandwidth || 0) * 8) / 1000) + 'kbps');
          this.pushStatValue('Track video', Math.round(((stats.videoTrackBandwidth || 0) * 8) / 1000) + 'kbps');
          this.pushStatValue('Skipped audio', (((stats.skippedAudio || 0) / 1000).toFixed(1)) + 's');
          this.pushStatValue('Skipped video', (((stats.skippedVideo || 0) / 1000).toFixed(1)) + 's');
          this.pushStatValue('Stalls', String(stats.stallCount || 0));
          this.uiStats.display(this.stats);
        },
        pushStatValue(name, value) {
          const values = this.stats.get(name);

          if (!values) {
            return;
          }

          values.push(value);

          if (values.length > 60) {
            values.shift();
          }
        },
        resetMetrics() {
          this.hasMetrics = false;

          for (const values of this.stats.values()) {
            values.length = 0;
          }

          this.uiStats?.reset();
        },
        appendMessage(message) {
          const currentLines = this.dataMessages ? this.dataMessages.split(/\r\n|\r|\n/) : [];
          const nextLines = [...currentLines, message].filter(Boolean).slice(-20);

          this.dataMessages = nextLines.join('\n');

          if (this.bottomPanelTab !== 'messages') {
            this.pendingMessageCount += 1;
          }
        },
        buildProtocols(selectedSource) {
          if (!selectedSource) {
            return [...this.sources];
          }

          const orderedProtocols = this.sources.filter((source) => source !== selectedSource);

          return [selectedSource, ...orderedProtocols];
        },
        buildQueryParams() {
          const query = new URLSearchParams();

          if (this.audioTrack) {
            query.set('audio', this.audioTrack);
          }
          if (this.videoTrack) {
            query.set('video', this.videoTrack);
          }

          return query;
        },
        buildWrtsSettings() {
          const settings = {
            reliable: !this.wrtsAdaptiveFrameSkipping
          };
          const bufferLimitLow = Number.parseInt(this.wrtsBufferLimitLow, 10);
          const bufferLimitHigh = Number.parseInt(this.wrtsBufferLimitHigh, 10);

          if (!Number.isNaN(bufferLimitLow)) {
            settings.bufferLimitLow = bufferLimitLow;
          }

          if (!Number.isNaN(bufferLimitHigh)) {
            settings.bufferLimitHigh = bufferLimitHigh;
          }

          return settings;
        },
        buildPlayerOptions(selectedSource) {
          const signaling = this.connectorType === this.connectorTypes[1] ? 'whip' : 'ceeblue-ws';

          return {
            responsive: true,
            muted: true,
            html5: {
              nativeControlsForTouch: false,
              vhs: {overrideNative: true},
              nativeAudioTracks: false,
              nativeVideoTracks: false,
            },
            plugins: {
              ceeblue: {
                autoFallback: this.auto,
                endPoint: this.host.toString(),
                streamName: this.streamName,
                accessToken: this.accessToken || void 0,
                maxRetries: Number.parseInt(this.retryCount, 10) || 0,
                enableQualityOptions: !!this.videobutton,
                protocols: this.buildProtocols(selectedSource),
                query: this.buildQueryParams(),
                settings: {
                  webrtc: {
                    signaling,
                  },
                  wrts: this.buildWrtsSettings()
                }
              }
            }
          };
        },
        getCurrentWrtsSource() {
          if (!player) {
            return null;
          }

          const tech = player.tech_ || (typeof player.tech === 'function' ? player.tech(true) : null);

          return tech?.wrts || null;
        },
        getCurrentProtocol() {
          const plugin = player?.ceeblue?.();

          return plugin?.currentSource?.sourceType || '';
        },
        isWrtsSelected() {
          return (this.source || this.selectedSource) === 'wrts';
        },
        syncPlaybackState(nextState) {
          this.playState = nextState;
          this.source = nextState === PlayState.STOPPED ? '' : this.getCurrentProtocol();

          if (nextState === PlayState.STOPPED) {
            this.quality = '';
          }
        },
        updateQualityFromLevels() {
          if (!player || typeof player.qualityLevels !== 'function') {
            this.quality = '';
            return;
          }

          const qualityLevels = player.qualityLevels();

          if (!qualityLevels || qualityLevels.selectedIndex < 0) {
            this.quality = '';
            return;
          }

          const quality = qualityLevels[qualityLevels.selectedIndex];

          if (!quality) {
            this.quality = '';
            return;
          }

          this.quality = quality.width + 'x' + quality.height + ' ' + Math.floor(quality.bitrate / 1000) + 'kbps';
        },
        bindPlayerEvents() {
          player.on('sourcechanged', (event) => {
            const source = event.details.source;

            console.log('sourcechanged', source);
            if (source) {
              this.dataMessages = '';
              this.pendingMessageCount = 0;
              this.resetMetrics();
            }
            this.source = source?.sourceType || this.getCurrentProtocol();
            this.selectedSource = this.source || this.selectedSource;
            this.updateQualityFromLevels();
          });

          player.on('loadstart', () => {
            this.syncPlaybackState(PlayState.STARTING);
          });

          player.on('loadedmetadata', () => {
            this.syncPlaybackState(PlayState.PLAYING);
            this.updateQualityFromLevels();
          });

          player.on('playing', () => {
            this.syncPlaybackState(PlayState.PLAYING);
          });

          player.on('pause', () => {
            if (player.ended()) {
              return;
            }

            if (player.currentSrc()) {
              this.syncPlaybackState(PlayState.STOPPED);
            }
          });

          player.on('ended', () => {
            this.syncPlaybackState(PlayState.STOPPED);
          });

          if (typeof player.qualityLevels === 'function') {
            const qualityLevels = player.qualityLevels();

            qualityLevels?.on('change', () => {
              this.updateQualityFromLevels();
            });
          }

          if (!textTracksBound) {
            player.textTracks().on('addtrack', (e) => {
              const track = e.track;

              track.on('cuechange', () => {
                const cue = track.activeCues[0];
                if (!cue) {
                  return;
                }
                const label = track.label ? '[' + track.label + ']' : '[' + cue.startTime.toFixed(3) + ']';

                this.appendMessage(label + ' ' + cue.text);
              });
            });
            textTracksBound = true;
          }

          /*player.ready(() => {
            const playPromise = player.play();

            if (playPromise !== undefined) {
              playPromise.catch((error) => {
                console.log('Playback failed:', error);
              });
            }
          });*/
        },
        startPlayback(selectedSource) {
          const nextSource = selectedSource || this.selectedSource || void 0;

          if (nextSource) {
            this.selectedSource = nextSource;
          }

          this.syncPlaybackState(PlayState.STARTING);

          if (!player) {
            this.playerOptions = this.buildPlayerOptions(nextSource);
            player = videojs(this.$refs.videoPlayer, this.playerOptions);
            this.bindPlayerEvents();
            return;
          }

          this.playerOptions = this.buildPlayerOptions(nextSource);
          player.ceeblue().replaceOptions(this.playerOptions.plugins.ceeblue);
          player.ceeblue().setSource(0);
        },
        applyWrtsNetworkProfile() {
          const profile = this.wrtsNetworkProfiles.find((entry) => entry.value === this.wrtsNetworkProfile);

          if (!profile || profile.value === '-manual-') {
            this.applyWrtsRuntimeSettings();
            return;
          }

          this.wrtsBufferLimitLow = profile.bufferLimitLow.toFixed();
          this.wrtsBufferLimitHigh = profile.bufferLimitHigh.toFixed();
          this.applyWrtsRuntimeSettings();
        },
        applyWrtsRuntimeSettings() {
          const wrtsSource = this.getCurrentWrtsSource();

          if (!wrtsSource) {
            return;
          }

          const bufferLimitLow = Number.parseInt(this.wrtsBufferLimitLow, 10);
          const bufferLimitHigh = Number.parseInt(this.wrtsBufferLimitHigh, 10);

          if (!Number.isNaN(bufferLimitLow)) {
            wrtsSource.bufferLimitLow = bufferLimitLow;
          }

          if (!Number.isNaN(bufferLimitHigh)) {
            wrtsSource.bufferLimitHigh = bufferLimitHigh;
          }

          wrtsSource.reliable = !this.wrtsAdaptiveFrameSkipping;
        },
        stopPlayback() {
          console.log('StopPlayback');
          if (!player) {
            return;
          }

          player.ceeblue().stop();
          this.syncPlaybackState(PlayState.STOPPED);
        },
        changeSource(e) {
          this.selectedSource = e.target.text;
          if (this.source == e.target.text)
            return;
          if (!player) {
            this.startPlayback(e.target.text);
          } else {
            player.ceeblue().setSource({ protocol: e.target.text });
          }
        },
        play() {
          if(this.playState === PlayState.STOPPED) {
            this.startPlayback();
          } else {
            this.stopPlayback();
          }
        },

        playButtonCaption() {
          if (this.isStopped())
            return 'Play';
          if (this.isStarting())
            return 'Starting... ';
          if (this.isPlaying())
            return 'Stop';
        },
        isPlaying() {
          return this.playState === PlayState.PLAYING;
        },
        isStarting() {
          return this.playState === PlayState.STARTING;
        },
        isStopped() {
          return this.playState === PlayState.STOPPED;
        }
      },
      watch: {
        bottomPanelTab(nextTab) {
          if (nextTab === 'messages') {
            this.pendingMessageCount = 0;
          }
        }
      }
    }).mount('#main');
    </script>
  </body>
</html>
